_schema-version: 3.3.0
ID: ui5App
description: A simple CAP project.
version: 1.0.0-SNAPSHOT
modules:
- name: ui5App-srv
  type: java
  path: srv
  properties:
    JBP_CONFIG_COMPONENTS: 'jres: [''com.sap.xs.java.buildpack.jre.SAPMachineJRE'']'
    JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
    SPRING_PROFILES_ACTIVE: cloud,sandbox
  requires:
  - name: ui5App-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: sap_java_buildpack_jakarta
    instances: 1
  build-parameters:
    build-result: target/*-exec.jar
    builder: custom
    commands:
    - mvn clean package -DskipTests=true --batch-mode
- name: ui5App-db-deployer
  type: hdb
  path: db
  requires:
  - name: ui5App-db
  parameters:
    buildpack: nodejs_buildpack
  build-parameters:
    builder: custom
    commands:
    - npm run build
- name: ui5App-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: ui5App-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comriztechui5appproject1.zip
      name: comriztechui5appproject1
      target-path: resources/
- name: comriztechui5appproject1
  type: html5
  path: project1
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: ui5App-destination-content
  type: com.sap.application.content
  requires:
  - name: ui5App-destination-service
    parameters:
      content-target: true
  - name: ui5App-repo-host
    parameters:
      service-key:
        name: ui5App-repo-host-key
  - name: uaa_ui5App
    parameters:
      service-key:
        name: uaa_ui5App-key
  parameters:
    content:
      instance:
        destinations:
        - Name: ui5_approuter_ui5App_repo_host
          ServiceInstanceName: ui5App-html5-service
          ServiceKeyName: ui5App-repo-host-key
          sap.cloud.service: ui5_approuter
        - Authentication: OAuth2UserTokenExchange
          Name: ui5_approuter_uaa_ui5App
          ServiceInstanceName: ui5App-xsuaa-service
          ServiceKeyName: uaa_ui5App-key
          sap.cloud.service: ui5_approuter
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
resources:
- name: ui5App-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: ui5App-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: ui5App-html5-service
    service-plan: app-host
- name: ui5App-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      version: 1.0.0
    service: destination
    service-name: ui5App-destination-service
    service-plan: lite
- name: uaa_ui5App
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: ui5App-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
